<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SFU MyProfessor</title>
    <meta name="color-scheme" content="light dark" />
  </head>
  <body>
    <header class="masthead">
      <p class="wordmark"><span class="wordmark-sfu">SFU</span> MyProfessor</p>
      <div class="tabs" role="radiogroup" aria-label="Search by">
        <button type="button" role="radio" aria-checked="true" data-mode="professor">Professors</button>
        <button type="button" role="radio" aria-checked="false" data-mode="course">Courses</button>
      </div>
      <form id="search-form" role="search">
        <div class="search-row">
          <div class="search-field">
            <label id="search-label" class="visually-hidden" for="professor-search">Professor name</label>
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg>
            <input id="professor-search" type="search" placeholder="First or last name" maxlength="100" autocomplete="off" spellcheck="false" autofocus />
            <button id="clear-search" type="button" aria-label="Clear search" hidden>
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m7 7 10 10M17 7 7 17"/></svg>
            </button>
          </div>
          <label class="visually-hidden" for="course-term">Term</label>
          <select id="course-term" hidden></select>
        </div>
      </form>
    </header>
    <main>
      <p id="search-status" role="status" aria-live="polite" aria-atomic="true"></p>
      <section id="empty-state" class="empty-state" aria-labelledby="state-title">
        <h1 id="state-title">Look up an SFU instructor</h1>
        <p id="state-description">Type a first or last name to see their Rate My Professors scores.</p>
        <p id="examples" class="examples" hidden></p>
        <button id="retry-search" class="retry-button" type="button" hidden>Try again</button>
      </section>
      <div id="loading-state" class="loading-state" aria-hidden="true" hidden>
        <div class="skeleton-row"><span></span><span></span><span></span></div>
        <div class="skeleton-row"><span></span><span></span><span></span></div>
        <div class="skeleton-row"><span></span><span></span><span></span></div>
      </div>
      <div id="course-summary" class="course-summary" hidden>
        <h2 id="course-title" class="course-title"></h2>
        <p id="course-meta" class="course-meta"></p>
      </div>
      <ul id="search-results" class="results" aria-label="Search results" hidden></ul>
      <p id="more-results" class="more-results" hidden>More matches are available. Add a first or last name to narrow your search.</p>
    </main>
    <footer>Scores from <a href="https://www.ratemyprofessors.com/" target="_blank" rel="noopener noreferrer">Rate My Professors</a>. Course instructors from SFU course outlines.</footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
