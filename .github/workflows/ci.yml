name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # postinstall patches WXT and runs `wxt prepare`.
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
